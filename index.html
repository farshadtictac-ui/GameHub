<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tactical Arcade</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Staatliches&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0d0a06;
    --board:#1c160d;
    --brass:#c9a24b;
    --brass-dim:#8a6a30;
    --paper:#e9dfc4;
    --ink:#a89a78;
    --ember:#b5482f;
    --locked:#5a5648;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--paper);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,162,75,.10), transparent 55%),
      radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.6), transparent 60%),
      var(--bg-deep);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  /* faint tactical grid, like a map table */
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      linear-gradient(rgba(201,162,75,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,75,.05) 1px, transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(ellipse at 50% 30%, black 0%, transparent 75%);
  }
  /* slow searchlight sweep */
  .sweep{
    position:fixed; top:-40%; left:-20%; width:140%; height:180%; z-index:0; pointer-events:none;
    background:conic-gradient(from 0deg at 30% 20%, transparent 0deg, rgba(201,162,75,.05) 8deg, transparent 20deg);
    animation:sweep 14s linear infinite;
  }
  @keyframes sweep{ to{ transform:rotate(360deg); } }

  .wrap{ position:relative; z-index:1; max-width:480px; margin:0 auto; padding:28px 18px 40px; }

  .hero{ text-align:center; margin-bottom:26px; }
  .eyebrow{
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:4px;
    color:var(--brass-dim); text-transform:uppercase; margin-bottom:6px;
  }
  .emblem{ font-size:40px; margin-bottom:2px; filter:drop-shadow(0 3px 6px rgba(0,0,0,.6)); }
  h1{
    font-family:'Staatliches',sans-serif; font-weight:400; letter-spacing:3px;
    font-size:34px; margin:2px 0 4px; color:var(--paper);
    text-shadow:0 2px 0 rgba(0,0,0,.5), 0 0 22px rgba(201,162,75,.25);
    text-transform:uppercase;
  }
  .tagline{ font-size:13px; color:var(--ink); margin:0; }

  .roster-label{
    font-family:'Courier New',monospace; font-size:11px; letter-spacing:3px;
    color:var(--brass-dim); text-transform:uppercase; margin:22px 2px 10px;
    display:flex; align-items:center; gap:8px;
  }
  .roster-label::after{ content:''; flex:1; height:1px; background:linear-gradient(90deg,rgba(201,162,75,.4),transparent); }

  .card{
    position:relative; display:flex; align-items:center; gap:14px;
    background:linear-gradient(155deg, #241b10, #171008);
    border:1px solid #3a2c18; border-radius:12px; padding:14px 16px;
    margin-bottom:12px; text-decoration:none; color:inherit;
    box-shadow:0 4px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.03);
    opacity:0; transform:translateY(10px);
    animation:drop .5s ease forwards;
  }
  .card:nth-child(1){ animation-delay:.05s; }
  .card:nth-child(2){ animation-delay:.15s; }
  .card:nth-child(3){ animation-delay:.25s; }
  @keyframes drop{ to{ opacity:1; transform:translateY(0); } }
  .card:active{ transform:scale(.98); }

  .card.available{ cursor:pointer; }
  .card.locked{ filter:grayscale(.6); opacity:.6 !important; animation:none; }

  .badge{
    flex:0 0 auto; width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    background:radial-gradient(circle at 35% 30%, #3a2c18, #17110a 70%);
    border:2px solid var(--brass-dim);
    box-shadow:0 0 0 3px rgba(0,0,0,.4), inset 0 0 10px rgba(0,0,0,.5);
  }
  .card.locked .badge{ border-color:var(--locked); }

  .card-body{ flex:1; min-width:0; }
  .card-title{
    font-family:'Staatliches',sans-serif; font-size:19px; letter-spacing:1px;
    color:var(--paper); text-transform:uppercase; margin:0 0 2px;
  }
  .card-sub{ font-size:12.5px; color:var(--ink); margin:0; line-height:1.35; }
  .card-tag{
    display:inline-block; margin-top:6px; font-family:'Courier New',monospace;
    font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--brass-dim);
    border:1px solid #3a2c18; border-radius:5px; padding:2px 7px;
  }

  .status{
    flex:0 0 auto; font-family:'Courier New',monospace; font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; padding:6px 10px; border-radius:6px; text-align:center;
  }
  .status.ready{ background:rgba(201,162,75,.15); color:var(--brass); border:1px solid var(--brass-dim); }
  .status.soon{ background:rgba(255,255,255,.04); color:var(--locked); border:1px solid #3a3626; }

  .footer{
    text-align:center; margin-top:30px; font-size:11px; color:#5a5040;
    font-family:'Courier New',monospace; letter-spacing:1px;
  }

  @media (prefers-reduced-motion: reduce){
    .sweep{ animation:none; }
    .card{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>
<div class="sweep"></div>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Tactical Arcade</div>
    <div class="emblem">🎖️</div>
    <h1>Choose Your Battle</h1>
    <p class="tagline">Pick a mission and deploy</p>
  </div>

  <div class="roster-label">Mission Roster</div>
  <div id="gameList"></div>

  <div class="footer" id="footerNote">LOADING ROSTER…</div>
</div>

<script>
  if(window.Telegram && window.Telegram.WebApp){
    try{ window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }catch(e){}
  }

  fetch('games.json?_='+Date.now())
    .then(r=>r.json())
    .then(games=>{
      const list = document.getElementById('gameList');
      list.innerHTML = '';
      games.forEach(g=>{
        const available = g.status === 'available';
        const el = document.createElement(available ? 'a' : 'div');
        el.className = 'card ' + (available ? 'available' : 'locked');
        if(available) el.href = g.path;
        el.innerHTML = `
          <div class="badge">${g.icon || '🎮'}</div>
          <div class="card-body">
            <p class="card-title">${g.title}${g.isNew ? ' <span style="color:var(--ember);font-size:11px;">● NEW</span>' : ''}</p>
            <p class="card-sub">${g.subtitle || ''}</p>
            ${g.tag ? `<span class="card-tag">${g.tag}</span>` : ''}
          </div>
          <div class="status ${available ? 'ready':'soon'}">${available ? 'Deploy' : 'Locked'}</div>
        `;
        list.appendChild(el);
      });

      // A quiet placeholder card hinting the roster will grow
      const more = document.createElement('div');
      more.className = 'card locked';
      more.innerHTML = `
        <div class="badge">➕</div>
        <div class="card-body">
          <p class="card-title">More Missions</p>
          <p class="card-sub">New games are added here over time</p>
        </div>
        <div class="status soon">Soon</div>
      `;
      list.appendChild(more);

      document.getElementById('footerNote').textContent = games.length + ' MISSION' + (games.length===1?'':'S') + ' AVAILABLE';
    })
    .catch(()=>{
      document.getElementById('gameList').innerHTML =
        '<p style="text-align:center;color:#a89a78;font-size:13px;">Could not load the game list. Please check your connection.</p>';
      document.getElementById('footerNote').textContent = '';
    });
</script>
</body>
</html>
