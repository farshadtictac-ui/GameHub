<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>New Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ---- Shared "Tactical Arcade" palette — keep these to match the hub & other games ---- */
  :root{
    --brass:#c9a24b;
    --paper:#e9dfc4;
    --bg-deep:#0d0a06;
    --panel:#241b10;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--paper); background:var(--bg-deep);
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:20px; margin:12px 0 2px; color:var(--brass); text-shadow:0 2px 3px rgba(0,0,0,.6); }
  .back-link{
    position:fixed; top:10px; left:12px; z-index:10; font-size:12px; color:var(--brass);
    text-decoration:none; border:1px solid var(--brass); border-radius:6px; padding:4px 9px;
    background:rgba(0,0,0,.4);
  }
  canvas{ touch-action:none; display:block; }

  /* Reuse these overlay/panel/button styles from Soldier Wars if this game needs
     a lobby, how-to-play, or win screen — keeps every game feeling like one family. */
  .overlay{
    position:fixed; inset:0; background:rgba(10,7,3,.88); display:none;
    align-items:center; justify-content:center; z-index:20; padding:20px;
  }
  .overlay.show{ display:flex; }
  .panel{
    background:var(--panel); border:2px solid var(--brass); border-radius:14px;
    padding:24px 26px; text-align:center; max-width:340px; width:100%;
  }
  .panel h2{ margin:0 0 10px; color:var(--brass); font-size:19px; }
  button.mainbtn{
    font-family:inherit; font-size:14px; font-weight:bold; border:none; border-radius:10px;
    padding:11px 18px; cursor:pointer;
    background:linear-gradient(180deg, var(--brass), #8a6a30); color:#241a10;
  }
  button.ghost{ background:transparent; border:2px solid var(--brass); color:var(--brass); }
</style>
</head>
<body>

<a class="back-link" href="../../index.html">← Games</a>
