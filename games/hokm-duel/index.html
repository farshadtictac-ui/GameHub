<title>Hokm Duel</title>
<style>
:root{
  --brass:#c9a24b;
  --paper:#e9dfc4;
  --red:#c8402a;
  --blue:#2a5fc8;
  --panel:#241a10;
  --panel2:#3a2a17;
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; min-height:100%;
  background:radial-gradient(ellipse at center, #1c3320 0%, #0d1a10 100%);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:var(--paper);
  display:flex; flex-direction:column; align-items:center;
  -webkit-tap-highlight-color: transparent;
  padding-bottom:24px;
}
h1{ font-size:20px; margin:12px 0 2px; color:var(--brass); text-shadow:0 2px 3px rgba(0,0,0,.6); }
.sub{ font-size:12px; color:#c9dcc9; margin-bottom:8px; text-align:center; padding:0 16px; max-width:480px;}
