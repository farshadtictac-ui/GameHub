<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Trench Runner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#12140f;
    --bg2:#1b1e16;
    --sand:#c9b896;
    --sand-dim:#8a7d63;
    --olive:#5c6b3f;
    --olive-dark:#3a4327;
    --accent:#d68a3c;
    --paper:#e9e2d0;
    --danger:#b0442f;
    --line:#2c2f24;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; min-height:100%;
    background:var(--bg);
    color:var(--paper);
    font-family:'Courier New', ui-monospace, monospace;
    overflow-x:hidden; overflow-y:auto;
    touch-action:pan-y;
    user-select:none;
    -webkit-overflow-scrolling:touch;
  }
  .wrap{
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    min-height:100%;
    min-height:calc(var(--app-height, 100vh));
    padding:10px; gap:8px;
  }
  .topbar{
    width:100%; max-width:640px;
    display:flex; align-items:center; justify-content:space-between;
    font-size:13px; letter-spacing:.05em; text-transform:uppercase; color:var(--sand-dim);
  }
  .topbar a{ color:var(--sand); text-decoration:none; border:1px solid var(--line); padding:5px 10px; border-radius:6px; }
  .topbar a:active{ background:var(--line); }
  .title{ font-weight:bold; color:var(--accent); letter-spacing:.08em; }

  .stage{
    position:relative;
    width:100%; max-width:640px;
    aspect-ratio: 16 / 7;
    background:linear-gradient(180deg, var(--bg2) 0%, var(--bg) 65%);
    border:2px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,.5);
    touch-action:none;
  }
  canvas{ display:block; width:100%; height:100%; }

  .hud{
    position:absolute; top:8px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 12px;
    font-size:14px; color:var(--sand); letter-spacing:.05em;
    pointer-events:none;
  }
  .hud .best{ color:var(--sand-dim); }

  .overlay{
    position:absolute; inset:0;
    display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px;
    background:rgba(10,11,8,.72);
    text-align:center; padding:16px;
  }
  .overlay.show{ display:flex; }
  .overlay h2{ margin:0; color:var(--accent); letter-spacing:.05em; font-size:22px; }
  .overlay p{ margin:0; color:var(--paper); font-size:14px; opacity:.85; }
  .mainbtn{
    margin-top:6px;
    background:var(--olive); color:var(--paper); border:1px solid var(--olive-dark);
    padding:10px 22px; border-radius:8px; font-size:15px; font-weight:bold;
    letter-spacing:.05em; cursor:pointer; font-family:inherit;
  }
  .mainbtn:active{ transform:translateY(1px); }

  .hint{
    max-width:640px; width:100%; text-align:center;
    font-size:12px; color:var(--sand-dim); letter-spacing:.03em; line-height:1.5;
  }
  .hint b{ color:var(--sand); }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <a href="../index.html" id="backLink">&larr; Hub</a>
    <span class="title">Trench Runner</span>
    <span style="width:52px;"></span>
  </div>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hud">
      <div id="scoreEl">0</div>
      <div class="best">BEST <span id="bestEl">0</span></div>
    </div>
    <div class="overlay" id="startOverlay">
      <h2>TRENCH RUNNER</h2>
      <p>No signal out here. Keep moving.</p>
      <button class="mainbtn" id="startBtn">Start</button>
    </div>
    <div class="overlay" id="overOverlay">
      <h2 id="overTitle">Down!</h2>
      <p id="overText">Distance: 0</p>
      <button class="mainbtn" id="retryBtn">Retry</button>
    </div>
  </div>

  <div class="hint">Tap / <b>Space</b> / <b>&uarr;</b> to jump &nbsp;&middot;&nbsp; hold down / <b>&darr;</b> to duck under drones</div>

</div>

<script>
(function(){
  'use strict';

  // ---------- Telegram integration ----------
  try{
    if(window.Telegram && Telegram.WebApp){
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
      if(Telegram.WebApp.disableVerticalSwipes) Telegram.WebApp.disableVerticalSwipes();
    }
  }catch(e){}

  function syncAppHeight(){
    let h = window.innerHeight;
    try{
      if(window.Telegram && Telegram.WebApp && Telegram.WebApp.viewportStableHeight){
        h = Telegram.WebApp.viewportStableHeight;
      }
    }catch(e){}
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  syncAppHeight();
  window.addEventListener('resize', syncAppHeight);
  window.addEventListener('orientationchange', ()=> setTimeout(()=>{ syncAppHeight(); if(window.__trResize) window.__trResize(); }, 200));
  try{
    if(window.Telegram && Telegram.WebApp && Telegram.WebApp.onEvent){
      Telegram.WebApp.onEvent('viewportChanged', ()=>{ syncAppHeight(); if(window.__trResize) window.__trResize(); });
    }
  }catch(e){}

  // ---------- Setup ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const scoreEl = document.getElementById('scoreEl');
  const bestEl = document.getElementById('bestEl');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const overTitle = document.getElementById('overTitle');
  const overText = document.getElementById('overText');

  const BASE_W = 800, BASE_H = 350; // logical resolution
  let scale = 1;

  function resize(){
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    scale = canvas.width / BASE_W;
    ctx.setTransform(scale,0,0,scale,0,0);
  }
  window.addEventListener('resize', resize);
  window.__trResize = resize;

  // ---------- Audio (tiny WebAudio blips, no assets) ----------
  let actx = null;
  function beep(freq, dur, type, gain){
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      const o = actx.createOscillator();
      const g = actx.createGain();
      o.type = type||'square';
      o.frequency.value = freq;
      g.gain.value = gain!==undefined?gain:0.06;
      o.connect(g); g.connect(actx.destination);
      const t = actx.currentTime;
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.start(t); o.stop(t+dur);
    }catch(e){}
  }
  const sfxJump = ()=> beep(520, .12, 'square', .05);
  const sfxHit  = ()=> beep(110, .35, 'sawtooth', .08);
  const sfxTick = ()=> beep(880, .05, 'sine', .03);

  // ---------- Ground ----------
  const GROUND_Y = 268;

  // ---------- Player (soldier silhouette, procedurally drawn) ----------
  const player = {
    x: 70, y: GROUND_Y, w: 34, h: 46,
    vy: 0, onGround: true, ducking: false,
    runFrame: 0, runTimer: 0
  };
  const GRAVITY = 0.62;
  const JUMP_V = -11.6;
  const DUCK_H = 26;

  function jump(){
    if(!running) return;
    if(player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
      sfxJump();
    }
  }
  function setDuck(v){
    player.ducking = v && player.onGround;
  }

  // ---------- Obstacles ----------
  // types: 'crate' (ground, jump over), 'wire' (low, ground, jump over, wider),
  // 'drone' (flies at head height, must duck)
  let obstacles = [];
  let spawnTimer = 0;

  function spawnGap(){
    // shrinks as speed grows, with randomness
    const base = Math.max(46, 105 - speed*3.2);
    return base + Math.random()*55;
  }

  function spawnObstacle(){
    const r = Math.random();
    let type;
    if(r < 0.38) type='crate';
    else if(r < 0.68) type='wire';
    else type='drone';

    if(type==='crate'){
      const stacked = Math.random() < 0.35;
      obstacles.push({ type, x: BASE_W+20, y: GROUND_Y, w: 26, h: stacked?46:26, stacked });
    } else if(type==='wire'){
      obstacles.push({ type, x: BASE_W+20, y: GROUND_Y, w: 46, h: 16 });
    } else {
      const high = Math.random() < 0.5;
      obstacles.push({ type, x: BASE_W+20, y: GROUND_Y - (high?70:38), w: 34, h: 20, high, wobble: Math.random()*Math.PI*2 });
    }
  }

  // ---------- Parallax background ----------
  let bgFar = [], bgNear = [];
  function initBg(){
    bgFar = []; bgNear = [];
    for(let i=0;i<7;i++) bgFar.push({ x: i*130 + Math.random()*40, h: 20+Math.random()*30 });
    for(let i=0;i<5;i++) bgNear.push({ x: i*180 + Math.random()*60, w: 30+Math.random()*40 });
  }
  initBg();

  // ---------- State ----------
  let running = false;
  let gameOver = false;
  let started = false;
  let speed = 5.2;
  let distance = 0;
  let score = 0;
  let best = 0;
  try{ best = parseInt(localStorage.getItem('trenchRunnerBest')||'0',10) || 0; }catch(e){ best = 0; }
  bestEl.textContent = best;

  let lastTs = 0;
  let scoreTickAcc = 0;

  function resetGame(){
    obstacles = [];
    spawnTimer = 40;
    speed = 5.2;
    distance = 0;
    score = 0;
    player.y = GROUND_Y; player.vy = 0; player.onGround = true; player.ducking = false;
    gameOver = false;
    scoreTickAcc = 0;
    initBg();
  }

  function startGame(){
    resetGame();
    started = true;
    running = true;
    startOverlay.classList.remove('show');
    overOverlay.classList.remove('show');
    lastTs = 0;
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    gameOver = true;
    sfxHit();
    const dist = Math.floor(distance);
    if(score > best){
      best = score;
      try{ localStorage.setItem('trenchRunnerBest', String(best)); }catch(e){}
    }
    bestEl.textContent = best;
    overTitle.textContent = (score>=best && score>0) ? 'New Best!' : 'Down!';
    overText.textContent = 'Distance ' + dist + 'm · Score ' + score;
    overOverlay.classList.add('show');
    if(window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback){
      try{ Telegram.WebApp.HapticFeedback.notificationOccurred('error'); }catch(e){}
    }
  }

  // ---------- Collision ----------
  function playerBox(){
    const h = player.ducking ? DUCK_H : player.h;
    const y = GROUND_Y - h;
    return { x: player.x+6, y: y+4, w: player.w-12, h: h-4 };
  }
  function obstacleBox(o){
    if(o.type==='drone'){
      const bob = Math.sin(o.wobble)*4;
      return { x:o.x, y:o.y+bob, w:o.w, h:o.h };
    }
    return { x:o.x, y:o.y-o.h, w:o.w, h:o.h };
  }
  function overlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  // ---------- Update ----------
  function update(dt){
    // difficulty ramp
    speed += dt*0.0026;
    distance += speed*dt*0.06;

    // player physics
    if(!player.onGround){
      player.vy += GRAVITY * dt*0.06;
      player.y += player.vy * dt*0.06;
      if(player.y >= GROUND_Y){
        player.y = GROUND_Y; player.vy = 0; player.onGround = true;
      }
    }
    player.runTimer += dt;
    if(player.runTimer > 90){ player.runTimer = 0; player.runFrame = (player.runFrame+1)%2; }

    // spawn obstacles
    spawnTimer -= dt*0.06;
    if(spawnTimer <= 0){
      spawnObstacle();
      spawnTimer = spawnGap();
    }

    // move + cull obstacles
    for(let i=obstacles.length-1;i>=0;i--){
      const o = obstacles[i];
      o.x -= speed * dt*0.06;
      if(o.type==='drone') o.wobble += dt*0.02;
      if(o.x < -60) obstacles.splice(i,1);
    }

    // collisions
    const pBox = playerBox();
    for(const o of obstacles){
      if(overlap(pBox, obstacleBox(o))){ endGame(); return; }
    }

    // score
    scoreTickAcc += dt;
    if(scoreTickAcc > 100){
      scoreTickAcc = 0;
      score += 1;
      if(score>0 && score%100===0) sfxTick();
    }
    scoreEl.textContent = score;

    // parallax scroll
    for(const b of bgFar){ b.x -= speed*dt*0.012; if(b.x < -20) b.x += 910; }
    for(const b of bgNear){ b.x -= speed*dt*0.03; if(b.x < -50) b.x += 900; }
  }

  // ---------- Draw ----------
  function draw(){
    ctx.clearRect(0,0,BASE_W,BASE_H);

    // sky gradient handled by CSS bg; draw distant hill silhouettes
    ctx.fillStyle = '#232a1c';
    for(const b of bgFar){
      ctx.beginPath();
      ctx.moveTo(b.x, GROUND_Y+2);
      ctx.quadraticCurveTo(b.x+45, GROUND_Y+2-b.h, b.x+90, GROUND_Y+2);
      ctx.fill();
    }

    // near silhouettes (bushes/ruins)
    ctx.fillStyle = '#171a12';
    for(const b of bgNear){
      ctx.fillRect(b.x, GROUND_Y-18, b.w, 18);
    }

    // ground line + dashes
    ctx.strokeStyle = '#4a4c3c';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y+2);
    ctx.lineTo(BASE_W, GROUND_Y+2);
    ctx.stroke();

    ctx.fillStyle = '#3c3e30';
    const dashOffset = (distance*6) % 40;
    for(let x = -dashOffset; x < BASE_W; x += 40){
      ctx.fillRect(x, GROUND_Y+6, 18, 3);
    }

    // obstacles
    for(const o of obstacles) drawObstacle(o);

    // player
    drawPlayer();
  }

  function drawObstacle(o){
    if(o.type==='crate'){
      ctx.fillStyle = '#7a5a34';
      ctx.strokeStyle = '#4a3720';
      ctx.lineWidth = 2;
      const y = GROUND_Y - o.h;
      ctx.fillRect(o.x, y, o.w, o.h);
      ctx.strokeRect(o.x, y, o.w, o.h);
      ctx.beginPath();
      ctx.moveTo(o.x, y); ctx.lineTo(o.x+o.w, y+o.h);
      ctx.moveTo(o.x+o.w, y); ctx.lineTo(o.x, y+o.h);
      ctx.stroke();
      if(o.stacked){
        ctx.strokeRect(o.x, y+o.h/2, o.w, o.h/2);
      }
    } else if(o.type==='wire'){
      const y = GROUND_Y - o.h;
      ctx.strokeStyle = '#9a9a8c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for(let i=0;i<=6;i++){
        const px = o.x + (o.w/6)*i;
        ctx.moveTo(px, GROUND_Y);
        ctx.lineTo(px, y+2);
      }
      ctx.moveTo(o.x, y+2); ctx.lineTo(o.x+o.w, y+2);
      ctx.stroke();
      ctx.fillStyle = '#c9b896';
      for(let i=0;i<=6;i++){
        const px = o.x + (o.w/6)*i;
        ctx.beginPath(); ctx.arc(px, y+2, 2, 0, Math.PI*2); ctx.fill();
      }
    } else if(o.type==='drone'){
      const box = obstacleBox(o);
      ctx.fillStyle = '#2c2f24';
      ctx.strokeStyle = '#d68a3c';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(box.x+box.w/2, box.y+box.h/2, box.w/2, box.h/2.6, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      // rotor blur
      ctx.strokeStyle = 'rgba(214,138,60,.6)';
      ctx.beginPath();
      ctx.moveTo(box.x-6, box.y+2); ctx.lineTo(box.x+box.w+6, box.y+2);
      ctx.stroke();
    }
  }

  function drawPlayer(){
    const ducking = player.ducking;
    const h = ducking ? DUCK_H : player.h;
    const y = GROUND_Y - h;
    const x = player.x;
    const w = player.w;

    ctx.fillStyle = '#e9e2d0';
    ctx.strokeStyle = '#12140f';
    ctx.lineWidth = 1.5;

    if(ducking){
      // crouched running silhouette
      ctx.beginPath();
      ctx.moveTo(x, y+h);
      ctx.lineTo(x, y+8);
      ctx.quadraticCurveTo(x, y, x+10, y);
      ctx.lineTo(x+w, y+6);
      ctx.lineTo(x+w-4, y+h*0.55);
      ctx.lineTo(x+w+6, y+h);
      ctx.lineTo(x+w-6, y+h);
      ctx.lineTo(x+w-10, y+h*0.7);
      ctx.lineTo(x+6, y+h*0.7);
      ctx.lineTo(x+2, y+h);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      return;
    }

    // body/torso
    ctx.beginPath();
    ctx.moveTo(x+8, y+h);
    ctx.lineTo(x+6, y+16);
    ctx.quadraticCurveTo(x+6, y+2, x+16, y);
    ctx.lineTo(x+24, y+2);
    ctx.quadraticCurveTo(x+30, y+6, x+28, y+16);
    ctx.lineTo(x+26, y+h*0.55);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // helmet
    ctx.beginPath();
    ctx.ellipse(x+18, y+6, 9, 6, 0, Math.PI, 0);
    ctx.fill(); ctx.stroke();

    // legs (two-frame run cycle, or straight if airborne)
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#e9e2d0';
    const midX = x+16, midY = y+h*0.6;
    if(!player.onGround){
      ctx.beginPath();
      ctx.moveTo(midX-2, midY); ctx.lineTo(midX-10, y+h-2);
      ctx.moveTo(midX+4, midY); ctx.lineTo(midX+12, y+h-6);
      ctx.stroke();
    } else if(player.runFrame===0){
      ctx.beginPath();
      ctx.moveTo(midX-2, midY); ctx.lineTo(midX-10, y+h);
      ctx.moveTo(midX+4, midY); ctx.lineTo(midX+10, y+h-8);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(midX-2, midY); ctx.lineTo(midX-8, y+h-8);
      ctx.moveTo(midX+4, midY); ctx.lineTo(midX+14, y+h);
      ctx.stroke();
    }

    // rifle
    ctx.strokeStyle = '#3a4327';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x+26, y+14); ctx.lineTo(x+w+10, y+10);
    ctx.stroke();
  }

  // ---------- Main loop ----------
  function loop(ts){
    if(!running){ return; }
    if(!lastTs) lastTs = ts;
    let dt = ts - lastTs;
    lastTs = ts;
    dt = Math.min(dt, 40); // clamp for tab-switch spikes

    update(dt);
    draw();

    requestAnimationFrame(loop);
  }

  // ---------- Input ----------
  function onKeyDown(e){
    if(e.code==='Space' || e.code==='ArrowUp'){
      e.preventDefault();
      if(!started || gameOver){ startGame(); }
      else jump();
    } else if(e.code==='ArrowDown'){
      e.preventDefault();
      setDuck(true);
    }
  }
  function onKeyUp(e){
    if(e.code==='ArrowDown') setDuck(false);
  }
  document.addEventListener('keydown', onKeyDown);
  document.addEventListener('keyup', onKeyUp);

  let dragStartY = null;
  stage.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.overlay')) return; // let Start/Retry buttons handle their own click
    e.preventDefault();
    if(!started || gameOver){ startGame(); return; }
    dragStartY = e.clientY;
    jump();
  });
  stage.addEventListener('pointermove', (e)=>{
    if(dragStartY===null || !running) return;
    if(e.clientY - dragStartY > 25) setDuck(true);
  });
  window.addEventListener('pointerup', ()=>{
    dragStartY = null;
    setDuck(false);
  });
  window.addEventListener('pointercancel', ()=>{
    dragStartY = null;
    setDuck(false);
  });

  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden) running = false;
  });

  // ---------- Init ----------
  resize();
  draw();
  startOverlay.classList.add('show');
})();
</script>
</body>
</html>
